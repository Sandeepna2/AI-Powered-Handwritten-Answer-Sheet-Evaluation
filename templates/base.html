<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bluebook Corrector - AI Handwritten Evaluation{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>

    {% include 'navbar.html' %}

    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="page-container" style="padding-top:0; padding-bottom:0;">
            <p>&copy; 2026 Bluebook Corrector. AI-Powered Handwritten Answer Sheet Evaluation System.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
