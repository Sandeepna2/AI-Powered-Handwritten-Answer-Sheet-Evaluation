{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="auth-wrapper" style="background: transparent;">
    <div style="text-align: center; max-width: 500px; padding: 2rem;">
        <h1 style="font-size: 6rem; font-weight: 800; color: var(--primary); line-height: 1;">404</h1>
        <h2 style="font-size: 1.5rem; color: var(--dark); margin-top: 1rem;">Page Not Found</h2>
        <p style="color: var(--text-muted); margin-top: 0.5rem; margin-bottom: 2rem;">
            The requested page or evaluation report could not be found or has been removed.
        </p>
        <a href="/dashboard" class="btn btn-primary">
            <i class="fa-solid fa-house"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
