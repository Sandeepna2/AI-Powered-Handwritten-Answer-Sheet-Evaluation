{% extends "base.html" %}

{% block title %}413 - File Too Large{% endblock %}

{% block content %}
<div class="auth-wrapper" style="background: transparent;">
    <div style="text-align: center; max-width: 500px; padding: 2rem;">
        <h1 style="font-size: 6rem; font-weight: 800; color: var(--warning); line-height: 1;">413</h1>
        <h2 style="font-size: 1.5rem; color: var(--dark); margin-top: 1rem;">File Size Exceeded</h2>
        <p style="color: var(--text-muted); margin-top: 0.5rem; margin-bottom: 2rem;">
            The uploaded file exceeds the maximum allowed limit of 40MB. Please compress your document and try again.
        </p>
        <a href="/upload-form" class="btn btn-primary">
            <i class="fa-solid fa-arrow-left"></i> Try Again
        </a>
    </div>
</div>
{% endblock %}
