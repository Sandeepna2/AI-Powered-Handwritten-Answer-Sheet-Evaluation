<nav class="navbar">
    <div class="navbar-inner">
        <a href="/" class="navbar-brand">
            <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
            <span>Bluebook Corrector</span>
        </a>

        <div class="nav-links">
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                <i class="fa-solid fa-house"></i> Home
            </a>

            {% if session.get('user_id') %}
                <a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">
                    <i class="fa-solid fa-chart-pie"></i> Dashboard
                </a>
                <a href="/upload-form" class="nav-link {% if request.path == '/upload-form' %}active{% endif %}">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Evaluate Sheet
                </a>
                <a href="/history" class="nav-link {% if request.path == '/history' %}active{% endif %}">
                    <i class="fa-solid fa-clock-rotate-left"></i> History
                </a>
            {% else %}
                <a href="/login" class="nav-link {% if request.path == '/login' %}active{% endif %}">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </a>
                <a href="/signup" class="btn btn-primary" style="padding: 0.45rem 1.1rem; font-size: 0.875rem;">
                    Sign Up
                </a>
            {% endif %}

            {% if session.get('is_admin') %}
                <a href="/admin" class="nav-link {% if request.path == '/admin' %}active{% endif %}" style="color:var(--accent);">
                    <i class="fa-solid fa-user-shield"></i> Admin
                </a>
            {% endif %}

            {% if session.get('user_id') %}
                <div class="nav-user">
                    <span class="user-badge"><i class="fa-solid fa-user"></i> {{ session.email.split('@')[0] }}</span>
                    <a href="/logout" class="nav-link" style="color:var(--danger); padding:0.4rem;" title="Logout">
                        <i class="fa-solid fa-power-off"></i>
                    </a>
                </div>
            {% endif %}
        </div>
    </div>
</nav>
